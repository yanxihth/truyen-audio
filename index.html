<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hieu Dep Trai</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
/* --- NỀN VÀ KHUNG GIAO DIỆN --- */
html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-image: url('https://i.ibb.co/WNSMPkNm/496117798-3754323384869835-7408404469544850494-n.jpg');/* anh nen doi linh o day*/
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #fff;
    font-family: Arial, sans-serif;
}

.wrap {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(10px);
    width: 100%;
    max-width: 450px;
    border-radius: 20px;
    padding: 25px;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0);
}

/* --- HIỆU ỨNG ẢNH ĐĨA XOAY TRÒN --- */
.hero {
    text-align: center;
    margin-bottom: 25px;
}

.cover-ring {
    width: 180px;
    height: 180px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, #ff69b4, #1db954);
    box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.cover-ring:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px rgba(255, 105, 180, 0.7);
}

.cover-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    animation: spinDisc 16s linear infinite;
    animation-play-state: paused;
}

.cover-ring.spinning .cover-img {
    animation-play-state: running;
}

@keyframes spinDisc {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* --- TIÊU ĐỀ --- */
.song-title {
    font-size: 24px;
    font-weight: 700;
    color: #ff69b4;
    text-shadow: 0 0 8px rgba(255,105,180, 0.6), 0 0 20px rgba(255,105,180, 0.3);
    margin-bottom: 5px;
}

.song-sub {
    font-size: 14px;
    opacity: 0.8;
}

.badge {
    background: #ff5555;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
    vertical-align: middle;
    margin-left: 5px;
}

/* --- THANH ĐIỀU HƯỚNG TIẾN TRÌNH --- */
.progress-wrap {
    margin-bottom: 25px;
}

.prog-bar {
    position: relative;
    height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    cursor: pointer;
}

.prog-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff69b4, #1db954);
    border-radius: 3px;
    width: 0%;
}

.prog-thumb {
    position: absolute;
    left: 0;
    top: 50%;
    width: 14px;
    height: 14px;
    background: #FF99CC;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    pointer-events: none;
    transition: transform 0.1s ease;
}

.prog-bar:hover .prog-thumb {
    transform: translate(-50%, -50%) scale(1.2);
}

.hidden-seek {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    margin: 0;
}

.times {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.6;
    margin-top: 8px;
}

/* --- CÁC NÚT ĐIỀU KHIỂN CHÍNH --- */
.main-ctrl {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.ctrl-btn, .play-btn {
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.ctrl-btn {
    background: rgba(255, 255, 255, 0.01);
    width: 44px;
    height: 44px;
    border-radius: 50%;
}

.ctrl-btn:hover {
    transform: scale(1.08);
}

/* --- NÚT PHÁT HÌNH TRÁI TIM --- */
.play-btn {
    /* Dùng SVG làm nền để vẽ hình trái tim CHỈ CÓ VIỀN neon mượt mà */
    background-color: transparent;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3e%3cpath fill='transparent' stroke='%23FF99CC' stroke-width='2' d='M 30 55 C 30 55, 4 35, 4 17 A 13 13 0 0 1 30 17 A 13 13 0 0 1 56 17 C 56 35, 30 55, 30 55 Z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: center;
    color: #FF99CC; 
    width: 60px;
    height: 60px;
    border-radius: 0; 
    /* Dùng filter drop-shadow để bóng bám sát theo hình dáng viền trái tim */
    filter: drop-shadow(0 0 8px rgba(255, 153, 204, 0.5)); 
    padding-bottom: 4px; /* Đẩy icon play lên một xíu cho nằm đúng trung tâm tim */
}
.play-btn:hover {
    /* Tăng độ đậm của viền và nền tim khi trỏ chuột vào */
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3e%3cpath fill='rgba(255,153,204,0.35)' stroke='%23FF99CC' stroke-width='2.5' d='M 30 55 C 30 55, 4 35, 4 17 A 13 13 0 0 1 30 17 A 13 13 0 0 1 56 17 C 56 35, 30 55, 30 55 Z'/%3e%3c/svg%3e");
    transform: scale(1.1);
    filter: drop-shadow(0 0 16px rgba(255, 153, 204, 0.8));
}

/* --- DANH SÁCH BÀI HÁT (PLAYLIST) --- */
.pl-wrap {
    max-height: 250px;
    overflow-y: auto;
    margin-top: 15px;
    padding-right: 5px;
}

.pl-wrap::-webkit-scrollbar { width: 5px; }
.pl-wrap::-webkit-scrollbar-track { background: transparent; }
.pl-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
.pl-wrap::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

.track-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    background: rgba(255, 255, 255, 0.04);
    margin-bottom: 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
}

.track-item:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateX(4px);
}

/* KHI CHƯƠNG ĐANG ĐƯỢC PHÁT (Màu hong) */
.track-item.on {
    color: #FF99CC;
}

.track-num {
    width: 24px;
    font-size: 13px;
    opacity: 0.5;
}

.track-item.on .track-name {
    color: #FF99CC;
    font-weight: bold;
}

.track-name {
    font-size: 14px;
    flex: 1;
}

/* SÓNG NHẠC HOẠT HÌNH KHI ĐANG PHÁT CHƯƠNG */
.now-bar {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    width: 24px;
    height: 14px;
}
.now-bar span {
    width: 3px;
    height: 100%;
    background-color: #FF99CC; 
    animation: bounceBar 0.8s ease infinite alternate;
}
.now-bar span:nth-child(2) { animation-delay: 0.2s; }
.now-bar span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounceBar {
    from { height: 20%; }
    to { height: 100%; }
}

/* --- MENU TÙY CHỈNH --- */
.settings-menu {
    position: fixed;
    right: max(18px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 1000;
    color: #d5e4e8;
    font-size: 13px;
    line-height: 1.5;
    color-scheme: dark;
}
.settings-menu > summary {
    display: flex; align-items: center; gap: 10px;
    min-height: 50px; max-width: calc(100vw - 36px); padding: 8px 12px 8px 8px;
    box-sizing: border-box; border-radius: 999px;
    border: 1px solid transparent;
    background: linear-gradient(135deg, #143a43f5, #081d26fa) padding-box,
                linear-gradient(125deg, #65e6d5b3, #ffffff26 55%, #448ebf80) border-box;
    box-shadow: 0 8px 26px #04151d66, inset 0 1px 0 #ffffff0d;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #c1d7df; font-size: 12px; font-weight: 500;
    user-select: none; -webkit-tap-highlight-color: transparent;
    transition: transform .2s, box-shadow .2s;
}
.settings-menu summary::-webkit-details-marker { display: none; }
.settings-menu summary { list-style: none; cursor: pointer; }
.settings-toggle-icon {
    display: grid; place-items: center; flex-shrink: 0;
    width: 32px; height: 32px; border-radius: 50%;
    color: #073b42; background: linear-gradient(140deg, #69edd0, #16c7d4);
    box-shadow: inset 0 1px 0 #ffffff80, 0 2px 10px #05c9bf26;
}
.settings-toggle-icon svg { width: 19px; height: 19px; }
.settings-toggle-close { display: none; }
.settings-menu[open] .settings-toggle-sliders { display: none; }
.settings-menu[open] .settings-toggle-close { display: block; }
.settings-brand { display: grid; gap: 1px; min-width: 0; line-height: 1.25; }
.settings-brand-caption { color: #a1c6cc; font-size: 9px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; }
.settings-menu > summary strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ecfffa; font-size: 14px; font-weight: 700; letter-spacing: .2px; }
@supports (background-clip: text) or (-webkit-background-clip: text) {
    .settings-menu > summary strong {
        background-image: linear-gradient(110deg, transparent 40%, #ffffff 50%, transparent 60%),
                          linear-gradient(90deg, #ff8bd1, #ffe58a, #7affd5, #7dd3ff, #c4a0ff, #ff8bd1);
        background-size: 250% 100%, 250% 100%;
        background-repeat: no-repeat;
        background-clip: text; -webkit-background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
        animation: brandSparkle 5s linear infinite;
    }
}
@keyframes brandSparkle {
    0% { background-position: 200% center, 0% center; text-shadow: 0 0 8px #ff8bd155; }
    45% { background-position: -150% center, 100% center; text-shadow: 0 0 9px #7dd3ff66; }
    70% { background-position: -150% center, 55% center; text-shadow: 0 0 8px #c4a0ff66; }
    100% { background-position: -150% center, 0% center; text-shadow: 0 0 8px #ff8bd155; }
}
.settings-toggle-chevron { width: 14px; height: 14px; flex-shrink: 0; margin-left: 6px; color: #81c8cc; transition: transform .2s; }
.settings-menu[open] .settings-toggle-chevron { transform: rotate(180deg); }
.settings-menu[open] > summary { box-shadow: 0 8px 26px #0005, 0 0 0 3px #3adbc415, inset 0 1px 0 #ffffff12; }
@media (hover: hover) {
    .settings-menu > summary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px #0005, 0 0 20px #2dd4bf26, inset 0 1px 0 #ffffff1f; }
}
.settings-menu > summary:active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) {
    .settings-menu > summary, .settings-toggle-chevron { transition: none; }
    .settings-menu > summary:hover, .settings-menu > summary:active { transform: none; }
    .settings-menu > summary strong { animation: none; background-position: -150% center, 50% center; }
}
@media (forced-colors: active) {
    .settings-menu > summary strong {
        background: none; color: ButtonText; -webkit-text-fill-color: currentColor;
        text-shadow: none; animation: none;
    }
}
.settings-panel {
    position: absolute; bottom: calc(100% + 12px); right: 0;
    width: min(360px, calc(100vw - 36px));
    max-height: calc(100vh - 110px - env(safe-area-inset-bottom));
    max-height: calc(100dvh - 110px - env(safe-area-inset-bottom));
    overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #34525c transparent;
    padding: 20px;
    box-sizing: border-box;
    background-color: #10252d;
    background-image: linear-gradient(#10252dcc, #10252dcc), var(--menu-background, none);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border: 1px solid #29434c;
    border-radius: 16px;
    box-shadow: 0 12px 40px #0006;
}
.settings-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.settings-heading h2 {
    margin: 0; font-size: 17px;
    background: linear-gradient(90deg, #00dfd8, #9470ff);
    background-clip: text; -webkit-background-clip: text; color: transparent;
}
.settings-menu .settings-close {
    padding: 0; width: 32px; height: 32px; flex-shrink: 0;
    background: #ffffff09; border-radius: 50%;
    color: #cedde1; font-size: 22px; line-height: 1;
}
.settings-menu label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: bold; }
.settings-menu input {
    width: 100%; min-width: 0; box-sizing: border-box; padding: 11px;
    border: 1px solid #34525c; border-radius: 10px;
    background: #0c222a; color: #e5f1f4; font: inherit;
}
.settings-menu button {
    margin: 0; padding: 10px 12px; border: 1px solid transparent;
    border-radius: 10px; background: #00c9ce; color: #09272e;
    font: inherit; font-weight: bold; cursor: pointer;
    transition: background .2s, border-color .2s;
}
.settings-menu p { font-size: 12px; line-height: 1.5; margin: 8px 0 0; color: #b5c9cf; }
.settings-menu #settingsStatus:empty, .settings-menu #seekStatus:empty { display: none; }
.settings-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid #29434c; }
.settings-section h3, .appearance-title {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 10px; font-size: 13px; font-weight: bold; color: #e0edf0;
}
.settings-section h3 i, .appearance-title i { color: #00c9ce; font-size: 17px; }
.speed-row, .sleep-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.settings-menu .speed-pill, .settings-menu .sleep-pill, .settings-menu .sleep-cancel {
    min-height: 42px; padding: 9px 2px; font-size: 12px;
    background: #1a3540; color: #c7dce2; border-color: #2d4a55;
}
.settings-menu .speed-pill:hover, .settings-menu .sleep-pill:hover { background: #254750; }
.settings-menu .speed-pill.on, .settings-menu .sleep-pill.on {
    color: #50eee5; background: #00c9ce20; border-color: #00c9ce;
}
.settings-menu .sleep-cancel { color: #ffb4b4; background: #ff7d7d0c; border-color: #ff7d7d33; }
.settings-menu .sleep-cancel:hover { background: #ff7d7d20; }
.timer-status { font-variant-numeric: tabular-nums; }
.seek-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.minute-field { display: flex; align-items: center; border: 1px solid #34525c; border-radius: 10px; background: #0c222a; }
.settings-menu .minute-field input { border: 0; background: transparent; }
.minute-field span { padding-right: 12px; color: #98b4be; font-size: 12px; }
.settings-menu .seek-button { white-space: nowrap; }
.settings-appearance > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
.settings-appearance .appearance-title { margin: 0; }
.settings-appearance .appearance-chevron { transition: transform .2s; }
.settings-appearance[open] .appearance-chevron { transform: rotate(180deg); }
.settings-menu .save-settings { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 14px; }
.image-file-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.image-file-controls img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid #34525c; }
.settings-menu .pick-image-button { background: #1a3540; color: #c7dce2; border-color: #34525c; font-size: 12px; }
.settings-menu .clear-image-button { padding: 8px; background: transparent; color: #ffb4b4; font-size: 12px; }
.image-file-status { overflow-wrap: anywhere; }
.image-file-status:empty { display: none; }
.settings-menu button:disabled { opacity: .55; cursor: wait; }
.settings-menu .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.settings-menu input:focus-visible, .settings-menu button:focus-visible,
.settings-menu summary:focus-visible { outline: 2px solid #00c9ce; outline-offset: 3px; }
@media (max-width: 600px) {
    .settings-menu {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
    }
    .settings-menu > summary {
        min-height: 38px; max-width: calc(100vw - 24px);
        padding: 5px 9px 5px 6px; gap: 6px;
    }
    .settings-toggle-icon { width: 24px; height: 24px; }
    .settings-toggle-icon svg { width: 15px; height: 15px; }
    .settings-brand-caption { font-size: 7px; letter-spacing: .7px; }
    .settings-menu > summary strong { font-size: 12px; }
    .settings-toggle-chevron { width: 10px; height: 10px; margin-left: 2px; }
}
</style>
</head>
<body>

<div class="wrap">
<div class="card">
  <div class="hero">
    <div class="cover-ring" id="coverRing">
      <img class="cover-img" src="https://jbagy.me/wp-content/uploads/2025/03/Hinh-anh-avatar-anime-nu-cute-4.jpg" alt="cover">
    </div>
    <div class="song-title" id="songTitle">Chọn chương để phát</div>
    <div class="song-sub"> <span class="badge">♡lê khánh ly♡</span></div>
  </div>
  <div class="body">
    <div class="progress-wrap">
      <div class="prog-bar" id="progBar">
        <div class="prog-fill" id="progFill"></div>
        <div class="prog-thumb" id="progThumb"></div>
        <input type="range" class="hidden-seek" id="seekInput" min="0" max="100" value="0">
      </div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="main-ctrl">
      <button class="ctrl-btn" onclick="skip(-15)" title="Lùi 15 giây">
        <i class="ti ti-heart" style="font-size:25px; color: #ff69b4; transform:scaleX(-1)" aria-hidden="true"></i>
      </button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <i class="ti ti-player-play-filled" style="font-size:22px;margin-left:2px" id="playIcon" aria-hidden="true"></i>
      </button>
      <button class="ctrl-btn" onclick="skip(15)" title="Tới 15 giây">
      <i class="ti ti-heart" style="font-size:25px; color: #ff69b4;" aria-hidden="true"></i>
      </button>
    </div>
    <div class="pl-wrap" id="playlist"></div>
  </div>
</div>
</div>

<details class="settings-menu" id="settingsMenu">
  <summary title="Tùy chỉnh phát truyện và giao diện" aria-label="Tùy chỉnh phát truyện và giao diện — Powered by Trung Hiếu">
    <span class="settings-toggle-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <g class="settings-toggle-sliders">
          <path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h9m4 0h3"/>
          <circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="18" r="2"/>
        </g>
        <path class="settings-toggle-close" d="m6 6 12 12M18 6 6 18"/>
      </svg>
    </span>
    <span class="settings-brand"><span class="settings-brand-caption">Powered by</span><strong>Trung Hiếu</strong></span>
    <svg class="settings-toggle-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4 10 4-4 4 4"/></svg>
  </summary>
  <div class="settings-panel">
  <div class="settings-heading">
    <h2>Powered by Trung Hiếu</h2>
    <button class="settings-close" id="closeSettings" type="button" aria-label="Đóng menu">×</button>
  </div>
  
 <section class="settings-section" aria-labelledby="speedHeading">
    <h3 id="speedHeading"><i class="ti ti-player-track-next" aria-hidden="true"></i> Tốc độ phát</h3>
    <div class="speed-row" id="speedRow" role="group" aria-labelledby="speedHeading">
      <button type="button" class="speed-pill on" data-speed="1.2" aria-pressed="true" onclick="setSpd(this,1.2)">1.2×</button>
      <button type="button" class="speed-pill" data-speed="1.4" aria-pressed="false" onclick="setSpd(this,1.4)">1.4×</button>
      <button type="button" class="speed-pill" data-speed="1.6" aria-pressed="false" onclick="setSpd(this,1.6)">1.6×</button>
      <button type="button" class="speed-pill" data-speed="1.8" aria-pressed="false" onclick="setSpd(this,1.8)">1.8×</button>
    </div>
  </section>
  <section class="settings-section" aria-labelledby="sleepHeading">
    <h3 id="sleepHeading"><i class="ti ti-moon" aria-hidden="true"></i> Hẹn giờ tắt</h3>
    <div class="sleep-row" role="group" aria-labelledby="sleepHeading">
      <button type="button" class="sleep-pill" id="s15" aria-pressed="false" onclick="setSleep(15,this)">15 phút</button>
      <button type="button" class="sleep-pill" id="s30" aria-pressed="false" onclick="setSleep(30,this)">30 phút</button>
      <button type="button" class="sleep-pill" id="s60" aria-pressed="false" onclick="setSleep(60,this)">60 phút</button>
      <button type="button" class="sleep-cancel" onclick="cancelSleep()">Hủy hẹn</button>
    </div>
    <p class="timer-status" id="sleepStatus" role="timer" aria-live="off">Chưa đặt hẹn giờ.</p>
  </section>
  <form class="settings-section" id="exactSeekForm">
    <h3><i class="ti ti-player-skip-forward" aria-hidden="true"></i> Tua đến phút</h3>
    <label class="visually-hidden" for="exactSeekTime">Số phút cần tua đến</label>
    <div class="seek-controls">
      <div class="minute-field">
        <input id="exactSeekTime" type="number" min="0" step="1" inputmode="numeric" placeholder="Ví dụ: 12" aria-describedby="seekStatus" required autocomplete="off">
        <span aria-hidden="true">phút</span>
      </div>
      <button class="seek-button" type="submit">Tua đến <span aria-hidden="true">→</span></button>
    </div>
    <p id="seekStatus" role="status"></p>
  </form>
  <details class="settings-section settings-appearance">
    <summary><span class="appearance-title"><i class="ti ti-palette" aria-hidden="true"></i> Truyện &amp; giao diện</span><span class="appearance-chevron" aria-hidden="true">⌄</span></summary>
    <form id="settingsForm">
    <label for="storyId">ID truyện trên Archive.org</label>
    <input id="storyId" name="storyId" required pattern="[A-Za-z0-9_.-]+" title="Nhập ID gồm chữ, số, dấu gạch ngang, gạch dưới hoặc dấu chấm." placeholder="DaiDuongTaMuonLamHoanKhoTH">
    <label for="backgroundUrl">Link ảnh nền trang chủ</label>
    <input id="backgroundUrl" name="backgroundUrl" type="url" required placeholder="https://…">
    <div class="image-file-controls">
      <input id="backgroundUrlFile" type="file" accept="image/*" hidden>
      <img id="backgroundUrlPreview" alt="Ảnh nền trang chủ đã chọn" hidden>
      <button id="backgroundUrlPick" class="pick-image-button" type="button" aria-label="Chọn ảnh nền trang chủ từ máy">Chọn ảnh từ máy</button>
      <button id="backgroundUrlClear" class="clear-image-button" type="button" aria-label="Bỏ chọn ảnh nền trang chủ từ máy" hidden>Bỏ chọn</button>
    </div>
    <p id="backgroundUrlStatus" class="image-file-status" role="status"></p>
    <label for="menuBackgroundUrl">Link ảnh nền menu</label>
    <input id="menuBackgroundUrl" name="menuBackgroundUrl" type="url" placeholder="https://…" aria-describedby="menuBackgroundHelp">
    <div class="image-file-controls">
      <input id="menuBackgroundUrlFile" type="file" accept="image/*" hidden>
      <img id="menuBackgroundUrlPreview" alt="Ảnh nền menu đã chọn" hidden>
      <button id="menuBackgroundUrlPick" class="pick-image-button" type="button" aria-label="Chọn ảnh nền menu từ máy">Chọn ảnh từ máy</button>
      <button id="menuBackgroundUrlClear" class="clear-image-button" type="button" aria-label="Bỏ chọn ảnh nền menu từ máy" hidden>Bỏ chọn</button>
    </div>
    <p id="menuBackgroundUrlStatus" class="image-file-status" role="status"></p>
    <p id="menuBackgroundHelp">Để trống để dùng nền màu mặc định của menu.</p>
    <label for="coverUrl">Đường dẫn ảnh bìa</label>
    <input id="coverUrl" name="coverUrl" type="url" required placeholder="https://…">
    <div class="image-file-controls">
      <input id="coverUrlFile" type="file" accept="image/*" hidden>
      <img id="coverUrlPreview" alt="Ảnh bìa đã chọn" hidden>
      <button id="coverUrlPick" class="pick-image-button" type="button" aria-label="Chọn ảnh bìa từ máy">Chọn ảnh từ máy</button>
      <button id="coverUrlClear" class="clear-image-button" type="button" aria-label="Bỏ chọn ảnh bìa từ máy" hidden>Bỏ chọn</button>
    </div>
    <p id="coverUrlStatus" class="image-file-status" role="status"></p>
    <p>Thay đổi được lưu trên trình duyệt này. Khi lưu, trang sẽ tải lại để áp dụng.</p>
    <button class="save-settings" type="submit">Lưu thay đổi <span aria-hidden="true">→</span></button>
    <p id="settingsStatus" role="status"></p>
  </form>
  </details>
  </div>
</details>

<audio id="audio"></audio>

<script>
// Cấu hình truyện và giao diện.
const DEFAULT_ID="DaiDuongTaMuonLamHoanKhoTH";
const settingsMenu=document.getElementById("settingsMenu");
function closeSettingsMenu(){
  settingsMenu.open=false;
  settingsMenu.querySelector("summary").focus();
}
document.getElementById("closeSettings").addEventListener("click",closeSettingsMenu);
document.addEventListener("keydown",event=>{
  if(event.key==="Escape" && settingsMenu.open) closeSettingsMenu();
});
document.addEventListener("click",event=>{
  if(settingsMenu.open && !settingsMenu.contains(event.target)) settingsMenu.open=false;
});
let settings={};
try { settings=JSON.parse(localStorage.getItem("player_settings")||"{}")||{}; } catch (_) {}
const ID=typeof settings.storyId==="string" && /^[A-Za-z0-9_.-]+$/.test(settings.storyId) ? settings.storyId : DEFAULT_ID;
const validImageUrl=value=>{
  try { return ["https:","http:"].includes(new URL(value).protocol); } catch (_) { return false; }
};
const isLocalImage=value=>typeof value==="string" && value.length<=600000 && /^data:image\/(?:webp|png|jpeg);base64,[A-Za-z0-9+/]+={0,2}$/.test(value);
const validImageSource=value=>validImageUrl(value)||isLocalImage(value);
const cssImageUrl=value=>"url("+JSON.stringify(value)+")";
const coverImage=document.querySelector(".cover-img");
const defaultBackgroundUrl=getComputedStyle(document.body).backgroundImage.slice(5,-2);
const defaultCoverUrl=coverImage.src;
if(validImageSource(settings.backgroundUrl)) {
  document.documentElement.style.backgroundImage=cssImageUrl(settings.backgroundUrl);
  document.body.style.backgroundImage=cssImageUrl(settings.backgroundUrl);
}
if(validImageSource(settings.menuBackgroundUrl)) {
  document.querySelector(".settings-panel").style.setProperty("--menu-background",cssImageUrl(settings.menuBackgroundUrl));
}
if(validImageSource(settings.coverUrl)) coverImage.src=settings.coverUrl;
document.getElementById("storyId").value=ID;
const imagePickers=new Map();
const saveSettingsButton=document.querySelector(".save-settings");
const imagesProcessing=()=>Array.from(imagePickers.values()).some(state=>state.busy);
function updateImageSaveButton(){saveSettingsButton.disabled=imagesProcessing()}

async function prepareLocalImage(file,maxDimension){
  if(file.type && !file.type.startsWith("image/")) throw new Error("Vui lòng chọn một tệp ảnh.");
  if(file.size>20*1024*1024) throw new Error("Vui lòng chọn ảnh nhỏ hơn 20 MB.");
  const objectUrl=URL.createObjectURL(file);
  try {
    const image=new Image();
    await new Promise((resolve,reject)=>{
      image.onload=resolve;
      image.onerror=()=>reject(new Error("Không đọc được ảnh. Hãy thử ảnh JPG, PNG hoặc WebP."));
      image.src=objectUrl;
    });
    if(!image.naturalWidth || !image.naturalHeight) throw new Error("Ảnh không hợp lệ.");
    const canvas=document.createElement("canvas");
    const context=canvas.getContext("2d");
    if(!context) throw new Error("Trình duyệt chưa hỗ trợ xử lý ảnh này.");
    let scale=Math.min(1,maxDimension/Math.max(image.naturalWidth,image.naturalHeight));
    for(let attempt=0;attempt<5;attempt++){
      canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const source=canvas.toDataURL("image/webp",0.8);
      if(isLocalImage(source)) return source;
      scale*=0.75;
    }
    throw new Error("Ảnh quá lớn để lưu. Vui lòng chọn ảnh khác.");
  } finally { URL.revokeObjectURL(objectUrl); }
}

function setupImagePicker(key,fallbackUrl,required){
  const input=document.getElementById(key);
  const fileInput=document.getElementById(key+"File");
  const preview=document.getElementById(key+"Preview");
  const clearButton=document.getElementById(key+"Clear");
  const status=document.getElementById(key+"Status");
  const state={localSource:isLocalImage(settings[key])?settings[key]:"",previousUrl:validImageUrl(settings[key])?settings[key]:fallbackUrl,busy:false,version:0};
  imagePickers.set(key,state);
  input.value=state.localSource?"":state.previousUrl;
  function render(message){
    input.required=required&&!state.localSource;
    input.placeholder=state.localSource?"Hoặc dán link để thay ảnh":"https://…";
    preview.hidden=clearButton.hidden=!state.localSource;
    if(state.localSource) preview.src=state.localSource;
    else preview.removeAttribute("src");
    status.textContent=message??(state.localSource?"Đang dùng ảnh từ máy.":"");
  }
  document.getElementById(key+"Pick").addEventListener("click",()=>fileInput.click());
  clearButton.addEventListener("click",()=>{
    state.version++;
    state.busy=false;
    state.localSource="";
    input.value=state.previousUrl;
    fileInput.value="";
    render();updateImageSaveButton();
  });
  input.addEventListener("input",()=>{
    state.version++;
    state.busy=false;
    state.localSource="";
    state.previousUrl=input.value.trim();
    fileInput.value="";
    render();updateImageSaveButton();
  });
  fileInput.addEventListener("change",async()=>{
    const file=fileInput.files[0];
    if(!file) return;
    const version=++state.version;
    state.busy=true;updateImageSaveButton();
    status.textContent="Đang chuẩn bị ảnh…";
    try {
      const source=await prepareLocalImage(file,key==="coverUrl"?640:1280);
      if(version!==state.version) return;
      state.previousUrl=input.value.trim()||state.previousUrl;
      state.localSource=source;
      input.value="";
      render("Đã chọn: "+file.name);
    } catch (error) {
      if(version===state.version) render(error.message);
    } finally {
      if(version===state.version){
        state.busy=false;fileInput.value="";updateImageSaveButton();
      }
    }
  });
  render();
}
setupImagePicker("backgroundUrl",defaultBackgroundUrl,true);
setupImagePicker("menuBackgroundUrl","",false);
setupImagePicker("coverUrl",defaultCoverUrl,true);
document.getElementById("settingsForm").addEventListener("submit",event=>{
  event.preventDefault();
  const status=document.getElementById("settingsStatus");
  if(imagesProcessing()){
    status.textContent="Vui lòng chờ ảnh chuẩn bị xong rồi lưu.";
    return;
  }
  const storyId=document.getElementById("storyId").value.trim();
  const imageSource=key=>imagePickers.get(key).localSource||document.getElementById(key).value.trim();
  const backgroundUrl=imageSource("backgroundUrl");
  const menuBackgroundUrl=imageSource("menuBackgroundUrl");
  const coverUrl=imageSource("coverUrl");
  if(!validImageSource(backgroundUrl)||!validImageSource(coverUrl)||(menuBackgroundUrl&&!validImageSource(menuBackgroundUrl))) {
    status.textContent="Vui lòng nhập đường dẫn ảnh bắt đầu bằng http:// hoặc https://.";
    return;
  }
  try {
    localStorage.setItem("player_settings",JSON.stringify({storyId,backgroundUrl,menuBackgroundUrl,coverUrl}));
    if(storyId!==ID) ["audio_index","audio_src","audio_time"].forEach(key=>localStorage.removeItem(key));
    location.reload();
  } catch (error) {
    status.textContent=error.name==="QuotaExceededError"
      ?"Bộ nhớ trình duyệt đã đầy. Hãy chọn ảnh nhỏ hơn rồi lưu lại."
      :"Không thể lưu. Hãy cho phép trình duyệt lưu dữ liệu rồi thử lại.";
  }
});
let tracks=[],cur=0,sleepTmr=null,sleepBtn=null;
const audio=document.getElementById("audio");
const pl=document.getElementById("playlist");
const progFill=document.getElementById("progFill");
const progThumb=document.getElementById("progThumb");
const seekInput=document.getElementById("seekInput");
const tCur=document.getElementById("tCur");
const tDur=document.getElementById("tDur");
const playIcon=document.getElementById("playIcon");
const coverRing=document.getElementById("coverRing");
const songTitle=document.getElementById("songTitle");
const sleepStatus=document.getElementById("sleepStatus");
let storedSpeed=1.2;
try { storedSpeed=Number(localStorage.getItem("audio_speed"))||1.2; } catch (_) {}
const initialSpeedButton=Array.from(document.querySelectorAll(".speed-pill"))
  .find(button=>Number(button.dataset.speed)===storedSpeed)||document.querySelector(".speed-pill");
setSpd(initialSpeedButton,Number(initialSpeedButton.dataset.speed));

function fmt(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+(sec<10?"0":"")+sec}

function renderProgress(time=audio.currentTime){
  const pct=(time/audio.duration*100)||0;
  progFill.style.width=pct+"%";
  progThumb.style.left=pct+"%";
  seekInput.value=pct;
  tCur.textContent=fmt(time);
}

audio.addEventListener("timeupdate",()=>{
  renderProgress();
  localStorage.setItem("audio_time",audio.currentTime);
  localStorage.setItem("audio_src",audio.src);
});
audio.addEventListener("loadedmetadata",()=>{tDur.textContent=fmt(audio.duration)});
audio.addEventListener("play",()=>{
  playIcon.className="ti ti-player-pause-filled";
  playIcon.style.marginLeft="0px";
  coverRing.classList.add("spinning");
});
audio.addEventListener("pause",()=>{
  playIcon.className="ti ti-player-play-filled";
  playIcon.style.marginLeft="2px";
  coverRing.classList.remove("spinning");
});
audio.addEventListener("ended",()=>{
  cur++;
  if(cur<tracks.length)loadTrack(cur,true);
});
seekInput.addEventListener("input",()=>{
  audio.currentTime=(seekInput.value/100)*audio.duration;
});

function togglePlay(){
  if(audio.paused)audio.play();
  else audio.pause();
}
function skip(s){audio.currentTime+=s}
document.getElementById("exactSeekForm").addEventListener("submit",event=>{
  event.preventDefault();
  const input=document.getElementById("exactSeekTime");
  const status=document.getElementById("seekStatus");
  const value=input.value.trim();
  const minutes=Number(value);
  if(value==="" || !Number.isInteger(minutes) || minutes<0) {
    status.textContent="Vui lòng nhập số phút là số nguyên từ 0 trở lên.";
    return;
  }
  if(audio.readyState<1 || !Number.isFinite(audio.duration) || audio.duration<=0) {
    status.textContent="Hãy chọn chương và chờ tải thời lượng trước khi tua.";
    return;
  }
  const seconds=minutes*60;
  if(!Number.isFinite(seconds) || seconds>audio.duration) {
    status.textContent="Thời gian không được vượt quá thời lượng chương ("+fmt(audio.duration)+").";
    return;
  }
  try {
    audio.currentTime=seconds;
    renderProgress(seconds);
    status.textContent="Đã tua đến phút "+minutes+".";
  } catch (_) { status.textContent="Chưa thể tua chương này. Vui lòng thử lại sau khi tải."; }
});
function setSpd(btn,v){
  audio.defaultPlaybackRate=v;
  audio.playbackRate=v;
  try { localStorage.setItem("audio_speed",v); } catch (_) {}
  document.querySelectorAll(".speed-pill").forEach(b=>{
    b.classList.toggle("on",b===btn);
    b.setAttribute("aria-pressed",String(b===btn));
  });
}
function loadTrack(i,play){
  cur=i;
  const t=tracks[i];
  audio.src="https://archive.org/download/"+ID+"/"+t.name;
  songTitle.textContent="Chương "+(i+1);
  if(play)audio.play();
  localStorage.setItem("audio_index",i);
  localStorage.setItem("audio_src",audio.src);
  localStorage.setItem("audio_time",0);
  setActive(i);
}
function setActive(i){
  document.querySelectorAll(".track-item").forEach((el,idx)=>{
    el.classList.toggle("on",idx===i);
    const ico=el.querySelector(".track-ico");
    if(idx===i){
      ico.innerHTML='<div class="now-bar"><span></span><span></span><span></span></div>';
    } else {
      ico.textContent=(idx+1);
      ico.className="track-num track-ico";
    }
  });
}
function setSleep(min,btn){
  cancelSleep();
  sleepBtn=btn;
  btn.classList.add("on");
  btn.setAttribute("aria-pressed","true");
  const endsAt=Date.now()+min*60*1000;
  const tick=()=>{
    const total=Math.ceil((endsAt-Date.now())/1000);
    if(total<=0){
      cancelSleep();audio.pause();
      sleepStatus.textContent="Đã hết giờ, tạm dừng phát.";
      return;
    }
    const m=String(Math.floor(total/60)).padStart(2,"0"),s=String(total%60).padStart(2,"0");
    sleepStatus.textContent="Sẽ dừng phát sau "+m+":"+s+".";
    sleepTmr=setTimeout(tick,1000);
  };
  tick();
}
function cancelSleep(){
  clearTimeout(sleepTmr);sleepTmr=null;
  if(sleepBtn){
    sleepBtn.classList.remove("on");
    sleepBtn.setAttribute("aria-pressed","false");
    sleepBtn=null;
  }
  sleepStatus.textContent="Chưa đặt hẹn giờ.";
}

fetch("https://archive.org/metadata/"+ID)
.then(r=>r.json())
.then(data=>{
  tracks=data.files.filter(f=> /\.(mp3|m4a|mp4)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  
  tracks.forEach((t,i)=>{
    const div=document.createElement("div");
    div.className="track-item";
    div.innerHTML='<span class="track-num track-ico">'+(i+1)+'</span><span class="track-name">❤️Chương '+(i+1)+' ❤️</span>';
    div.onclick=()=>loadTrack(i,true);
    pl.appendChild(div);
  });
  
  const si=localStorage.getItem("audio_index"),src=localStorage.getItem("audio_src"),st=localStorage.getItem("audio_time");
  if(src&&tracks.length){
    cur=si?parseInt(si):0;
    audio.src=src;
    songTitle.textContent="Chương "+(cur+1);
    setActive(cur);
    audio.addEventListener("loadedmetadata",()=>{if(st)audio.currentTime=parseFloat(st)},{once:true});
  }
});
</script>
</body>
</html>
